<!DOCTYPE html>
<html>
<head>
    <title>Notes App with LocalStorage</title>
</head>
<body>

    <h2>My Notes</h2>

    <textarea id="notesArea" rows="10" cols="50" placeholder="Write your notes here..."></textarea>
    <br><br>

    <button id="saveBtn">Save Notes</button>
    <button id="loadBtn">Load Notes</button>
    <button id="clearBtn">Clear Notes</button>

    <script>

        // On page load: auto-load notes if available
        window.onload = function() {
            const savedNotes = localStorage.getItem("userNotes");
            if (savedNotes) {
                document.getElementById("notesArea").value = savedNotes;
            }
        };

        // Save button functionality
        document.getElementById("saveBtn").onclick = function() {
            const notes = document.getElementById("notesArea").value.trim();

            // Validation: prevent saving empty notes
            if (notes === "") {
                alert("Cannot save empty notes!");
                return;
            }

            localStorage.setItem("userNotes", notes);
            alert("Notes saved successfully!");
        };

        // Load button functionality
        document.getElementById("loadBtn").onclick = function() {
            const savedNotes = localStorage.getItem("userNotes");

            if (savedNotes) {
                document.getElementById("notesArea").value = savedNotes;
            } else {
                alert("No saved notes found.");
            }
        };

        // Clear button functionality
        document.getElementById("clearBtn").onclick = function() {
            localStorage.removeItem("userNotes");
            document.getElementById("notesArea").value = "";
            alert("Notes cleared!");
        };

    </script>

</body>
</html>
